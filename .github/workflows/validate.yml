name: Validate and package First Date

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the complete personal Claude skill
        run: python scripts/package_skill.py
      - name: Validate specification and ZIP integrity
        run: python scripts/validate_skill.py
      - name: Publish downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-date-claude-skill
          path: dist/first-date.zip
          if-no-files-found: error
          retention-days: 30
